name: Type Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  pyright:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyright

      - name: Run Pyright (strict mode)
        run: pyright sstq --outputjson > pyright-report.json || true

      - name: Comment PR with type errors
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = require('./pyright-report.json');
            if (report.generalDiagnostics?.length > 0) {
              const errors = report.generalDiagnostics.map(d => 
                `- ${d.file}:${d.range.start.line}:${d.range.start.character} - ${d.message}`
              ).join('\n');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## Type Check Errors\n\n${errors}`
              });
            }
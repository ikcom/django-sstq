name: CI

env:
  DJANGO_SETTINGS_MODULE: testconf.settings

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install ruff

      - name: Run Ruff linter
        run: ruff check sstq --output-format=github

      - name: Run Ruff formatter check
        run: ruff format sstq --check

  pyright:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv sync --group=dev
          uv add pyright

      - name: Run Pyright (strict mode)
        run: uv run pyright sstq --outputjson > pyright-report.json || true

      - name: Comment PR with type errors
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = require('./pyright-report.json');
            if (report.generalDiagnostics?.length > 0) {
              const errors = report.generalDiagnostics.map(d => 
                `- ${d.file}:${d.range.start.line}:${d.range.start.character} - ${d.message}`
              ).join('\n');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## Type Check Errors\n\n${errors}`
              });
            }

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        django-version: ["4.2", "5.0", "6.0"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv sync --group=dev
          uv pip install django==${{ matrix.django-version }}.*

      - name: Run tests and generate coverage
        run: uv run coverage run manage.py test sstq

      - name: Check coverage threshold
        run: uv run coverage report --fail-under=85

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: .coverage
          flags: unittests
          name: py${{ matrix.python-version }}-django${{ matrix.django-version }}

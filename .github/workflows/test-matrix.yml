name: Test Matrix

env:
  DJANGO_SETTINGS_MODULE: testconf.settings

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        django-version: ["4.2", "5.0", "6.0"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv sync --group=dev
          uv pip install django==${{ matrix.django-version }}.*

      - name: Run tests and generate coverage
        run: uv run coverage run manage.py test sstq

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: .coverage
          flags: unittests
          name: py${{ matrix.python-version }}-django${{ matrix.django-version }}
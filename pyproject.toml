[project]
name = "sstq"
version = "0.1.0"
description = "Super Simple Task Queue"
readme = "README.rst"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES"]
authors = [
    { name = "Ilir Kokollari", email = "ilir@ilirkokollari.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.3",
]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sstq*"]

[tool.setuptools]
include-package-data = true

[dependency-groups]
dev = [
    "coverage>=7.13.4",
    "watchdog>=6.0.0",
]
docs = [
    "furo>=2025.12.19",
    "sphinx>=9.1.0",
    "sphinxcontrib-django>=2.5",
]

[tool.coverage.run]
source = ["sstq"]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "testconf/*",
    "manage.py",
    "sstq/__init__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@overload",
]

[tool.coverage.html]
directory = "htmlcov"
